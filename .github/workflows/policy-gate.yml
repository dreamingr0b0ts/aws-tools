# Policy gate for infrastructure changes.
#
# Two layers, on purpose:
#   * policy        - OPA/Conftest enforcing ORG policy; BLOCKING.
#   * checkov-scan  - Checkov broad security baseline; ADVISORY (soft-fail).
# Custom OPA gates the merge; Checkov gives breadth without blocking on the
# many baseline checks a minimal demo module won't satisfy.
name: Policy Gate

on:
  pull_request:
    paths: ["preventative_deploy/**"]
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preventative_deploy
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install Conftest
        run: |
          VER=0.56.0
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${VER}/conftest_${VER}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      - name: Policy unit tests
        run: conftest verify -p policy

      - name: Enforce policy on a compliant plan (must pass)
        run: ./demo.sh compliant

  checkov-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: pip install checkov
      - name: Checkov baseline scan (advisory, non-blocking)
        run: checkov -d preventative_deploy/terraform --compact --soft-fail
