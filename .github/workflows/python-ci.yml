# Lint and test the Python automation tools.
name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the supported floor (3.11) and a current interpreter so the
        # "3.11+" support claim is actually exercised, not just asserted.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest + moto)
        run: pytest -q
