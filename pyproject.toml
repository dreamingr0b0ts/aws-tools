# Dev tooling config for the Python automation tools.
# (preventative_deploy is Terraform/Rego/YAML and is excluded from Python linting.)

[tool.pytest.ini_options]
testpaths = ["automations", "local_automations", "dev-workflow-automations"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
# Supported floor is Python 3.11 (actively maintained; 3.9/3.10 are past or
# nearing end-of-life). Lint/format for that baseline regardless of the
# interpreter running ruff.
target-version = "py311"
exclude = [".venv", "preventative_deploy"]
